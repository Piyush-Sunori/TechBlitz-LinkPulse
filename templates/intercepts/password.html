{% extends "base.html" %}
{% block title %}Password required | LinkPulse{% endblock %}
{% block body %}<main class="intercept-page"><section class="intercept-card"><span class="intercept-icon"><i class="fa-solid fa-lock"></i></span><p class="eyebrow mt-5">PROTECTED LINK</p><h1 class="mt-2 text-2xl font-bold">Password required</h1><p class="mt-2 text-sm text-slate-600">Enter the password provided by the link owner to continue.</p>{% if error %}<p class="form-alert mt-4">{{ error }}</p>{% endif %}<form class="mt-5" action="/{{ link.short_code }}/unlock" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="sr-only" for="link-password">Link password</label><input id="link-password" class="field-input" type="password" name="password" placeholder="Enter link password" autocomplete="current-password" required autofocus><button class="button button-primary mt-3 w-full" type="submit">Unlock link</button></form><a href="/" class="mt-5 inline-block text-sm font-semibold text-indigo-700">Return to LinkPulse</a></section></main>{% endblock %}
